/* VLESS кнопка — пульсирующая подсветка */
@keyframes pulse-vless {

/* ============================================================================
   THEME ENGINE
   Каждая тема задаёт CSS-переменные. .bento / .grad-primary и т.д.
   читают переменные → один тап смены темы перекрашивает всё приложение.
   ============================================================================ */
:root { --r: 18px; }
html, body, #root { height: 100%; }
body {
  font-family: var(--font, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", system-ui, sans-serif);
  color: var(--text-main, #ececef);
  background: var(--bg-base, #07070a);
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
  min-height: 100dvh;
  position: relative;
  transition: background-color .35s ease;
}
::-webkit-scrollbar { width: 0; height: 0; }
.num { font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }

/* фоновое свечение / эффекты */
body::before {
  content: ""; position: fixed; inset: 0; z-index: 0;
  background: var(--bg-overlay, none);
  pointer-events: none;
}

/* основная карточка */
.bento {
  background: var(--card-bg, #0f0f14);
  border: 1px solid var(--card-border, #ffffff10);
  border-radius: var(--r);
  transition: transform .35s cubic-bezier(.2,.8,.2,1), border-color .35s, box-shadow .35s;
  position: relative;
  overflow: hidden;
  backdrop-filter: var(--card-blur, none);
}
.bento:hover, .bento:active {
  transform: translateY(-2px);
  border-color: var(--card-border-hover, #ffffff30);
  box-shadow: var(--card-shadow-hover, 0 12px 40px -10px rgba(0,0,0,.6));
}
.bento::after {
  content: "";
  position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(420px circle at var(--mx,50%) var(--my,50%), var(--glow-color, rgba(255,255,255,.06)), transparent 45%);
  opacity: 0; transition: opacity .35s;
}
.bento:hover::after { opacity: 1; }

/* акцентные градиенты */
.grad-primary    { background: var(--grad-primary,   linear-gradient(135deg,#8b5cf6,#c084fc)); }
.grad-secondary  { background: var(--grad-secondary, linear-gradient(135deg,#2dd4bf,#06b6d4)); }
.grad-warm       { background: var(--grad-warm,      linear-gradient(135deg,#f472b6,#c084fc)); }
.grad-amber      { background: var(--grad-amber,     linear-gradient(135deg,#fbbf24,#f97316)); }
.grad-blue       { background: var(--grad-blue,      linear-gradient(135deg,#60a5fa,#6366f1)); }

.accent       { color: var(--accent,      #c084fc); }
.accent-soft  { color: var(--accent-soft, #ddd6fe); }
.text-mono    { font-family: var(--mono, "SF Mono", Menlo, Consolas, monospace); }
.ring-accent  { box-shadow: var(--ring-accent, 0 0 0 1px rgba(192,132,252,.4), 0 0 24px -4px rgba(192,132,252,.5)); }
.text-muted   { color: var(--text-muted, #71717a); }

/* === T1 · Flowbit Pro =================================================== */
body[data-theme="flowbit"] {
  --bg-base: #07070a;
  --bg-overlay: radial-gradient(900px 500px at 12% -12%, rgba(139,92,246,.18), transparent 60%),
                radial-gradient(700px 420px at 105% 110%, rgba(45,212,191,.10), transparent 55%);
  --card-bg: #0f0f14;
  --card-border: #ffffff10;
  --card-border-hover: rgba(168,85,247,.55);
  --card-shadow-hover: 0 0 0 1px rgba(168,85,247,.45), 0 12px 40px -10px rgba(139,92,246,.55);
  --glow-color: rgba(168,85,247,.18);
  --accent: #c4b5fd;
  --accent-soft: #ddd6fe;
  --text-main: #ececef;
  --text-muted: #a1a1aa;
  --grad-primary:   linear-gradient(135deg,#8b5cf6,#c084fc 60%,#6366f1);
  --grad-secondary: linear-gradient(135deg,#2dd4bf,#06b6d4);
  --grad-warm:      linear-gradient(135deg,#f472b6,#c084fc);
  --ring-accent: 0 0 0 1px rgba(168,85,247,.45), 0 0 28px -4px rgba(139,92,246,.6);
}

/* === T2 · Aurora Glass =================================================== */
body[data-theme="aurora"] {
  --bg-base: #06060a;
  --bg-overlay: none;
  --card-bg: rgba(20,18,30,.55);
  --card-border: rgba(255,255,255,.10);
  --card-border-hover: rgba(192,132,252,.55);
  --card-shadow-hover: 0 16px 50px -8px rgba(168,85,247,.45), inset 0 1px 0 rgba(255,255,255,.10);
  --card-blur: blur(18px);
  --glow-color: rgba(192,132,252,.20);
  --accent: #c4b5fd;
  --accent-soft: #5eead4;
  --text-main: #ececef;
  --text-muted: #a1a1aa;
  --grad-primary:   linear-gradient(135deg,#2dd4bf 0%,#a855f7 60%,#c084fc);
  --grad-secondary: linear-gradient(135deg,#06b6d4,#a855f7);
  --grad-warm:      linear-gradient(135deg,#f472b6,#a855f7);
  --ring-accent: 0 0 0 1px rgba(192,132,252,.45), 0 0 24px -2px rgba(168,85,247,.55);
}
body[data-theme="aurora"] .blob { position: fixed; border-radius: 999px; filter: blur(80px); opacity: .55; pointer-events: none; z-index: 0; animation: drift 22s ease-in-out infinite alternate; }
body[data-theme="aurora"] .blob.b1 { width: 380px; height: 380px; background: #2dd4bf; top: -120px; left: -100px; }
body[data-theme="aurora"] .blob.b2 { width: 460px; height: 460px; background: #a855f7; top: 200px; right: -150px; animation-delay: -6s; }
body[data-theme="aurora"] .blob.b3 { width: 380px; height: 380px; background: #c084fc; bottom: -100px; left: -50px; animation-delay: -12s; }
body[data-theme="aurora"] .blob.b4 { width: 320px; height: 320px; background: #6366f1; bottom: 250px; right: 30%; animation-delay: -3s; }
@keyframes drift { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(40px,30px) scale(1.06); } }

/* === T3 · Cyber Neon ===================================================== */
body[data-theme="cyber"] {
  --bg-base: #000;
  --bg-overlay:
     linear-gradient(rgba(34,211,238,.05) 1px, transparent 1px) 0 0/40px 40px,
     linear-gradient(90deg, rgba(34,211,238,.05) 1px, transparent 1px) 0 0/40px 40px;
  --card-bg: linear-gradient(180deg, #0b0d10, #050608);
  --card-border: rgba(34,211,238,.30);
  --card-border-hover: rgba(217,70,239,.7);
  --card-shadow-hover: 0 0 0 1px rgba(217,70,239,.5), 0 0 40px rgba(217,70,239,.4), inset 0 0 30px rgba(34,211,238,.05);
  --glow-color: rgba(34,211,238,.15);
  --accent: #67e8f9;
  --accent-soft: #f0abfc;
  --text-main: #d4d4d8;
  --text-muted: #71717a;
  --font: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
  --grad-primary:   linear-gradient(135deg,#22d3ee,#d946ef);
  --grad-secondary: linear-gradient(135deg,#22d3ee,#0ea5e9);
  --grad-warm:      linear-gradient(135deg,#d946ef,#ec4899);
  --ring-accent: 0 0 0 1px rgba(34,211,238,.6), 0 0 28px -2px rgba(34,211,238,.55);
  --r: 12px;
}
body[data-theme="cyber"]::before {
  background:
    linear-gradient(rgba(34,211,238,.05) 1px, transparent 1px) 0 0/40px 40px,
    linear-gradient(90deg, rgba(34,211,238,.05) 1px, transparent 1px) 0 0/40px 40px,
    repeating-linear-gradient(0deg, transparent 0, transparent 2px, rgba(255,255,255,.025) 3px, rgba(255,255,255,.025) 4px);
  mix-blend-mode: screen;
}

/* === T4 · Bento Living ==================================================== */
body[data-theme="bento"] {
  --bg-base: #0a0a0d;
  --bg-overlay: none;
  --card-bg: #18181c;
  --card-border: rgba(255,255,255,.06);
  --card-border-hover: rgba(192,132,252,.45);

}

/* === T5 · TG Premium+ ===================================================== */
body[data-theme="tg"] {
  --bg-base: #17212b;
  --bg-overlay: none;

  --card-border: rgba(255,255,255,.04);

}

/* === T6 · Vision Frosted ================================================== */
body[data-theme="vision"] {
  --bg-base: #0a0a0f;
  --bg-overlay: none;
  --card-bg: rgba(255,255,255,.05);

  --r: 22px;
}
body[data-theme="vision"] .blob { position: fixed; border-radius: 999px; filter: blur(80px); opacity: .35; pointer-events: none; z-index: 0; animation: drift 26s ease-in-out infinite alternate; }

/* === пульсация для status-dot ============================================ */

<script type="text/babel" data-presets="env,react">
const { useState, useEffect, useCallback, useRef } = React;
const { createRoot } = ReactDOM;

const tg = window.Telegram?.WebApp;
tg?.ready?.();
tg?.expand?.();

const THEMES = [
  { id: "flowbit", name: "Flowbit Pro",   sub: "violet × premium",   bg: "#07070a", accent: "#c4b5fd" },
  { id: "aurora",  name: "Aurora Glass",  sub: "стекло × сияние",    bg: "#06060a", accent: "#5eead4" },
  { id: "cyber",   name: "Cyber Neon",    sub: "киберпанк × неон",   bg: "#000",    accent: "#67e8f9" },
  { id: "bento",   name: "Bento Living",  sub: "градиенты × hover",  bg: "#0a0a0d", accent: "#c4b5fd" },
  { id: "tg",      name: "TG Premium+",   sub: "нативный Telegram",  bg: "#17212b", accent: "#a78bfa" },
  { id: "vision",  name: "Vision Frosted",sub: "Apple Vision Pro",   bg: "#0a0a0f", accent: "#c4b5fd" },
];
const THEME_KEY = "xservis_theme_v2";

function setBodyTheme(id) {
  const t = THEMES.find(x => x.id === id) || THEMES[0];
  document.body.dataset.theme = t.id;
  document.getElementById("meta-theme-color")?.setAttribute("content", t.bg);
  try { tg?.setHeaderColor?.(t.bg); tg?.setBackgroundColor?.(t.bg); } catch {}
  localStorage.setItem(THEME_KEY, t.id);
}
(function bootTheme() {
  const saved = localStorage.getItem(THEME_KEY);
  setBodyTheme(saved && THEMES.some(t => t.id === saved) ? saved : "flowbit");
})();

const API_BASE = (window.XSERVIS_API || "").replace(/\/+$/, "") || "";
const SUPPORT_URL = "https://t.me/xservis_support";

async function api(path, opts = {}) {
  const headers = { "Content-Type": "application/json", ...(opts.headers || {}) };
  if (tg?.initData) headers["X-Telegram-Init-Data"] = tg.initData;
  const r = await fetch(`${API_BASE}${path}`, { ...opts, headers });
  if (!r.ok) {
    const txt = await r.text().catch(() => "");
    throw new Error(`HTTP ${r.status} ${txt.slice(0,180)}`);
  }
  const ct = r.headers.get("content-type") || "";
  return ct.includes("json") ? r.json() : r.text();
}

function haptic(kind = "soft") {
  try {
    if (kind === "soft")    tg?.HapticFeedback?.impactOccurred?.("soft");
    if (kind === "medium")  tg?.HapticFeedback?.impactOccurred?.("medium");
    if (kind === "success") tg?.HapticFeedback?.notificationOccurred?.("success");
    if (kind === "error")   tg?.HapticFeedback?.notificationOccurred?.("error");
  } catch {}
}

function fmtRub(v) { return new Intl.NumberFormat('ru-RU').format(Math.round(v||0)); }
function daysLeft(iso) { if (!iso) return 0; return Math.max(0, Math.round((new Date(iso) - new Date()) / 86400000)); }
function fmtDate(iso) { if (!iso) return ""; return new Date(iso).toLocaleDateString('ru-RU', { day:'2-digit', month:'long', year:'numeric' }); }
function fmtDateShort(iso) { if (!iso) return ""; return new Date(iso).toLocaleDateString('ru-RU', { day:'2-digit', month:'2-digit', year:'2-digit' }); }

function useMouseGlow() {
  useEffect(() => {
    const handler = (e) => {
      document.querySelectorAll(".bento").forEach(t => {
        const r = t.getBoundingClientRect();
        if (e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom) {
          t.style.setProperty("--mx", (e.clientX - r.left) + "px");
          t.style.setProperty("--my", (e.clientY - r.top) + "px");
        }
      });
    };
    document.addEventListener("mousemove", handler, { passive: true });
    return () => document.removeEventListener("mousemove", handler);
  }, []);
}

function TariffSheet({ onClose, onPick }) {
  const [tariffs, setTariffs] = useState(null);
  const [pick, setPick] = useState({ tariff: "standard", months: 1 });
  const [busy, setBusy] = useState(false);
  const [providers, setProviders] = useState(null);
  const [err, setErr] = useState(null);

  useEffect(() => { api("/api/webapp/tariffs").then(setTariffs).catch(e => setErr(e.message)); }, []);
  useEffect(() => {
    if (!tariffs) return;
    setProviders(null);
    api(`/api/webapp/providers?tariff=${pick.tariff}&months=${pick.months}`).then(setProviders).catch(()=>{});
  }, [pick, tariffs]);

  const buy = async (provider) => {
    setBusy(true); setErr(null);
    try {
      const r = await api("/api/webapp/buy", { method: "POST", body: JSON.stringify({ ...pick, provider }) });
      if (r.invoice_url) {
        haptic("success");
        if (provider === "stars") tg?.openInvoice?.(r.invoice_url);
        else tg?.openLink?.(r.invoice_url);
        onPick?.();
        setTimeout(onClose, 500);
      }
    } catch (e) { haptic("error"); setErr(e.message); }
    finally { setBusy(false); }
  };

  if (err && !tariffs) return <Sheet title="Тарифы" onClose={onClose}><p className="text-rose-300">{err}</p></Sheet>;
  if (!tariffs) return <Sheet title="Тарифы" onClose={onClose}><p className="text-muted">Загрузка…</p></Sheet>;

  const t = tariffs.find(x => x.code === pick.tariff);
  const total = (t?.rub || 0) * pick.months;

  return (
    <Sheet title="Выберите тариф" onClose={onClose}>
      <div className="space-y-2 mb-4">
        {tariffs.map(x => (
          <button key={x.code} onClick={() => setPick(p => ({ ...p, tariff: x.code }))}
            className={`w-full text-left p-3 rounded-xl border transition ${pick.tariff===x.code ? "ring-accent" : ""}`}

              <div>
                <p className="font-bold accent">{x.name}</p>
                <p className="text-xs text-muted">{x.subtitle}</p>
              </div>
              <p className="text-lg font-bold num">{fmtRub(x.rub)} <span className="text-xs text-muted">₽/мес</span></p>
            </div>
            <ul className="mt-2 space-y-0.5">
              {x.features.map((f,i) => <li key={i} className="text-[11px] text-muted">· {f}</li>)}

          </button>
        ))}

              className={`py-2 rounded-lg text-sm font-bold ${pick.months===m ? "grad-primary text-white" : "bento"}`}>
              {m} мес
            </button>
          ))}
        </div>
      </div>

      <div className="mb-4 p-3 rounded-xl bento flex justify-between items-center">
        <span className="text-sm text-muted">К оплате</span>
        <span className="text-2xl font-bold num accent">{fmtRub(total)} ₽</span>
      </div>

      <p className="text-[10px] uppercase tracking-[.2em] text-muted text-mono mb-2">Способ оплаты</p>
      <div className="space-y-2">
        {(providers?.quotes || [
          { provider:"stars", label:"Telegram Stars" },
          { provider:"cryptobot", label:"CryptoBot · USDT/TON" },
          { provider:"xrocket", label:"xRocket · USDT/TON" },
        ]).map(q => (
          <button key={q.provider} onClick={() => buy(q.provider)} disabled={busy}

        ))}
      </div>

    </Sheet>
  );

function AiTab() {
  const [msgs, setMsgs] = useState([{ role: "ai", text: "Привет 🤍 Я Айма. Помогу подобрать тариф, подключить устройство или разобраться с оплатой. О чём рассказать?" }]);
  const [input, setInput] = useState("");
  const [busy, setBusy] = useState(false);
  const [listening, setListening] = useState(false);
  const recognitionRef = useRef(null);
  const ref = useRef(null);
  useEffect(() => { ref.current?.scrollTo(0, ref.current.scrollHeight); }, [msgs]);
  const send = async () => {
    const q = input.trim(); if (!q || busy) return;
    setMsgs(m => [...m, { role: "u", text: q }]); setInput(""); setBusy(true);
    try { const r = await api("/api/ai/chat", { method:"POST", body: JSON.stringify({ message: q }) }); setMsgs(m => [...m, { role: "ai", text: r.reply || "Извините, попробуйте ещё раз." }]); }
    catch { setMsgs(m => [...m, { role: "ai", text: "Я ненадолго выхожу — попробуй через минуту 🤍" }]); }
    finally { setBusy(false); }
  };
  return (
    <div className="flex flex-col gap-3" style={{height: "calc(100dvh - 180px)"}}>
      <div className="bento p-3 flex items-center gap-3">
        <div className="size-10 rounded-xl grad-primary flex items-center justify-center ring-accent">
          <I.Chat className="size-5 text-white"/>
        </div>
        <div className="flex-1">
          <p className="font-bold accent">Айма</p>
          <p className="text-[10px] uppercase tracking-[.25em] text-mono accent-soft">online · готова помочь</p>
        </div>
      </div>
      <div ref={ref} className="bento flex-1 p-3 overflow-y-auto space-y-2">
        {msgs.map((m, i) => (
          <div key={i} className={`max-w-[85%] p-2.5 rounded-xl text-sm leading-relaxed ${m.role==="ai" ? "bento" : "ml-auto grad-primary text-white font-medium"}`}>
            {m.text}
          </div>
        ))}
        {busy && <div className="text-xs text-muted text-mono">Айма печатает…</div>}
      </div>
      <div className="flex gap-2">
        <input type="text" value={input} onChange={e => setInput(e.target.value)}
          onKeyDown={e => e.key === "Enter" && send()}
          placeholder="Напишите или скажите…"
          className="flex-1 bento px-3 py-3 text-sm outline-none"/>
        <button onClick={() => {
          if (listening) { recognitionRef.current?.stop(); setListening(false); return; }
          const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
          if (!SR) { setInput(i => i + " (голос не поддерживается)"); return; }
          const rec = new SR();
          recognitionRef.current = rec;
          rec.lang = "ru-RU";
          rec.interimResults = false;
          rec.onresult = (e) => { const t = e.results[0][0].transcript; setInput(t); setListening(false); };
          rec.onerror = () => setListening(false);
          rec.onend = () => setListening(false);
          rec.start();
          setListening(true);
          haptic("soft");
        }} className={`size-12 rounded-xl flex items-center justify-center ${listening ? "grad-warm" : "bento"} text-white`}>
          <svg className="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 1a4 4 0 0 0-4 4v7a4 4 0 0 0 8 0V5a4 4 0 0 0-4-4z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
        </button>
        <button onClick={send} disabled={busy || !input.trim()} className="size-12 rounded-xl grad-primary flex items-center justify-center disabled:opacity-40 text-white">
          <I.Send className="size-5"/>
        </button>
      </div>
    </div>
  );
}

function AimaFixWidget() {
  const [show, setShow] = useState(false);
  const [result, setResult] = useState(null);
  const [busy, setBusy] = useState(false);
  const [platform, setPlatform] = useState("");
  const [client, setClient] = useState("");
  const [lastErr, setLastErr] = useState("");

  const submit = async () => {
    setBusy(true);
    try {
      const r = await api("/api/viral/diagnose", {
        method: "POST",
        body: JSON.stringify({ client_type: client || null, platform: platform || null, last_error: lastErr || null }),
      });
      setResult(r);
    } catch { setResult({ steps: ["Не удалось получить диагностику. Попробуйте позже."] }); }
    finally { setBusy(false); }
  };

  return (
    <div className="bento col-span-6 p-4">
      <button onClick={() => setShow(!show)} className="flex items-center justify-between w-full text-left">
        <div>
          <p className="text-sm font-bold">🔧 Aima Fix My VPN</p>
          <p className="text-[10px] text-muted">Автодиагностика проблем с подключением</p>
        </div>
        <span className="text-muted">{show ? "▲" : "▼"}</span>
      </button>
      {show && (
        <div className="mt-3 space-y-2">
          {!result ? (
            <>
              <input value={platform} onChange={e => setPlatform(e.target.value)}
                placeholder="Платформа (iOS/Android/Windows)"
                className="w-full p-2 rounded-lg text-sm bg-black/30 border border-white/10 text-white"/>
              <input value={client} onChange={e => setClient(e.target.value)}
                placeholder="VPN-клиент (Hiddify/V2RayTun)"
                className="w-full p-2 rounded-lg text-sm bg-black/30 border border-white/10 text-white"/>
              <input value={lastErr} onChange={e => setLastErr(e.target.value)}
                placeholder="Описание ошибки (необязательно)"
                className="w-full p-2 rounded-lg text-sm bg-black/30 border border-white/10 text-white"/>
              <button onClick={submit} disabled={busy}
                className="w-full py-2 rounded-xl grad-primary text-white font-bold text-sm">
                {busy ? "Анализ…" : "Запустить диагностику"}
              </button>
            </>
          ) : (
            <div className="space-y-2">
              <p className="text-xs text-muted uppercase tracking-widest">Рекомендации:</p>
              {result.steps.map((s, i) => (
                <p key={i} className="text-sm">{s}</p>
              ))}
              <button onClick={() => { setResult(null); setLastErr(""); }}
                className="mt-2 text-xs accent underline">Повторить</button>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function App() {
  useMouseGlow();
  const [me, setMe] = useState(null);
  const [tab, setTab] = useState("home");
  const [sheet, setSheet] = useState(null);
  const [error, setError] = useState(null);
  const [refreshN, setRefreshN] = useState(0);
  const [theme, setThemeState] = useState(() => localStorage.getItem(THEME_KEY) || "flowbit");
  const [noTg, setNoTg] = useState(false);

  const refetch = useCallback(async () => {
    if (!tg?.initData) { setNoTg(true); return; }
    try { setMe(await api("/api/webapp/me")); }
    catch (e) { setError(e.message); }
  }, []);
  useEffect(() => { refetch(); }, [refetch, refreshN]);

  useEffect(() => {
    if (!tg?.BackButton) return;
    if (sheet) {
      tg.BackButton.show();
      const cb = () => setSheet(null);
      tg.BackButton.onClick(cb);
      return () => { tg.BackButton.offClick(cb); tg.BackButton.hide(); };
    }
  }, [sheet]);

  const setTheme = (id) => { setBodyTheme(id); setThemeState(id); };

  if (noTg) return <NoTelegramFallback/>;

  if (error) {
    return (
      <div className="min-h-app flex items-center justify-center px-6 text-center">
        <div className="bento p-6">
          <p className="font-semibold text-rose-300 text-mono uppercase tracking-[.2em]">ERROR</p>
          <p className="text-sm text-muted mt-2 break-all">{error}</p>
          <button onClick={() => { setError(null); setRefreshN(x=>x+1); }}
            className="mt-4 px-4 py-2 rounded-xl grad-primary text-white font-bold">Повторить</button>
        </div>
      </div>
    );
  }
  if (!me) {
    return (
      <div className="px-3 py-3 max-w-md mx-auto">
        <div className="skeleton h-14 mb-4"/>
        <div className="skeleton h-44 mb-3"/>
        <div className="grid grid-cols-2 gap-3 mb-3"><div className="skeleton h-28"/><div className="skeleton h-28"/></div>
        <div className="skeleton h-24"/>
      </div>
    );
  }

  return (
    <div className="min-h-app max-w-md mx-auto pb-24 pt-3 px-3 relative z-10">
      <Header user={{ username: me.username || tg?.initDataUnsafe?.user?.username }} onSettings={() => setSheet("themes")}/>
      {tab === "home"    && <HomeTab    me={me} onSheet={setSheet}/>}
      {tab === "stats"   && <StatsTab   me={me}/>}
      {tab === "ai"      && <AiTab/>}
      {tab === "profile" && <ProfileTab me={me} currentTheme={theme} setTheme={setTheme}/>}
      <BottomNav tab={tab} setTab={setTab}/>
      {sheet === "vless"    && <VlessSheet  me={me} onClose={() => setSheet(null)}/>}
      {sheet === "tariff"   && <TariffSheet onClose={() => setSheet(null)} onPick={() => setRefreshN(x => x+1)}/>}
      {sheet === "trial"    && <TrialSheet  onClose={() => setSheet(null)} onDone={() => setRefreshN(x => x+1)}/>}
      {sheet === "ai"       && <AiTab/>}
      {sheet === "themes"   && <ThemePicker onClose={() => setSheet(null)} currentTheme={theme} setTheme={setTheme}/>}
    </div>
  );
}

createRoot(document.getElementById("root")).render(<App/>);
</script>
